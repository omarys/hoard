# Dev/build toolchain for hoard.
#
#   mise install    # installs everything below
#   mise run pre-commit  # local quality gates (fmt/clippy/tests)

[tools]
# Rust toolchain. hoard uses edition 2024 (needs >= 1.85).
rust = "1.98.1"
# Git hook runner driving .pre-commit-config.yaml
pre-commit = "latest"

[tasks]
pre-commit = { run = "pre-commit run --all-files" }
