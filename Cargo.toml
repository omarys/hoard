[package]
name = "hoard-rs"
version = "2.0.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Denis Heid"]
description = "hoard - cli command organizer written in Rust"
homepage = "https://hyde46.github.io/hoard/"
repository = "https://github.com/Hyde46/hoard"

[package.metadata.deb]
maintainer = "Denis Heid"
copyright = "2022, Denis Heid"
license-file = ["LICENSE"]
depends = "$auto"
section = "utility"

[package.metadata.rpm]
package = "hoard"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[[bin]]
name = "hoard"
path = "src/main.rs"

[features]
# Passthrough for dialoguer's optional Theme methods implemented in `gui::theme`.
# Only active when compiled with these features, matching upstream gating.
password = ["dialoguer/password"]
fuzzy-select = ["dialoguer/fuzzy-select"]

[dependencies]
# Command line argument parser
clap = { version = "4.6.6", features = ["derive"] }
# pretty dialogues in terminal
dialoguer = "0.12.0"
# Terminal backend for the interactive UI
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
# Conversational prompts on top of console
console = "0.16.6"
# YAML only for trove import/export and the cloud sync protocol
# (the crate is archived upstream; local storage is SQLite via rusqlite)
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
anyhow = "1.0.104"
eyre = "0.6.14"
dirs = "7.0.0"
# Table rendering for `hoard list --simple`
comfy-table = "8.0.0"
rand = "0.10.2"
thiserror = "2.0.20"
crossbeam-channel = "0.5.17"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
url = { version = "2.5.8" }
base64 = "0.23.1"
# .env loading (maintained fork of the archived `dotenv` crate)
dotenvy = "0.15.7"
regex = "1.13.1"
# Local trove storage
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }

[dev-dependencies]
tempfile = "3.3.0"
